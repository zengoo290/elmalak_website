  <style>

    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }

  </style>

    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

<body>
  <div id="__bundler_placeholder">Loading كنيسة رئيس الملائكة ميخائيل والأنبا شنودة...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            // Stream the input and output concurrently. Awaiting writer.write()
            // before starting the reader can deadlock on large compressed assets.
            const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
            finalBytes = new Uint8Array(await new Response(stream).arrayBuffer());
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"padding:10px 0\">المواعيد<\u002Fa>\n<a class=\"nv\" href=\"#services\" style=\"padding:10px 0\">الخدمات<\u002Fa>\n<a class=\"nv\" href=\"#news\" style=\"padding:10px 0\">الأخبار<\u002Fa>\n<a class=\"nv\" href=\"#contact\" style=\"padding:10px 0\">تواصل معنا<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:48px 64px;padding-top:64px\">\n<div style=\"flex:1 1 420px;min-width:0\">\n<div style=\"font-size:15px;font-weight:600;letter-spacing:.04em;color:{{accent}}\">الكنيسة القبطية الأرثوذكسية<\u002Fdiv>\n<h1 style=\"margin:12px 0 0;font-family:'Amiri',serif;font-weight:700;font-size:clamp(30px,4.6vw,48px);line-height:1.5;color:#F6F1DA;text-wrap:balance\">كنيسة رئيس الملائكة الجليل ميخائيل والقديس العظيم الأنبا شنودة رئيس المتوحدين<\u002Fh1>\n<div style=\"margin-top:8px;font-family:'Amiri',serif;font-size:28px;font-weight:700;color:{{accent}}\">بعياد بك بشبرا<\u002Fdiv>\n<p style=\"margin:20px 0 0;font-size:18px;color:#D6D3C8;max-width:52ch\">بيتك وبيت أسرتك. تعالَ صلِّ معنا، وتعرّف على مواعيد القداسات والاجتماعات والخدمات.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:32px\">\n<a class=\"btn\" href=\"#times\" style=\"display:inline-block;background:#E3C46A;color:#2A2417;padding:13px 28px;border-radius:6px;font-weight:600\">مواعيد القداسات<\u002Fa>\n<a class=\"btn\" href=\"#contact\" style=\"display:inline-block;border:1.5px solid #E3C46A;color:#F1E7A8;padding:11.5px 28px;border-radius:6px;font-weight:600\">كيف تصل إلينا<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:0 1 380px;width:100%;max-width:380px;min-width:0;margin-inline:auto\">\n<img src=\"c36e58cc-e701-457f-a7fe-a6694dd87150\" alt=\"شعار كنيسة رئيس الملائكة ميخائيل والأنبا شنودة بعياد بك بشبرا\" style=\"display:block;width:100%;aspect-ratio:1/1;border-radius:50%;object-fit:cover;box-shadow:0 20px 50px rgba(0,0,0,.45)\">\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ABOUT -->\n\n\n<!-- TIMES: interactive November calendar -->\n<div id=\"about\" style=\"max-width:1100px;margin:0 auto;padding:80px 24px 40px;box-sizing:border-box\">\n<div style=\"display:flex;flex-wrap:wrap;gap:32px 64px\">\n<div style=\"flex:1 1 320px;min-width:0\">\n<div style=\"font-size:15px;font-weight:600;color:{{accent}}\">عن الكنيسة<\u002Fdiv>\n<h2 style=\"margin:4px 0 0;font-family:'Amiri',serif;font-size:38px;line-height:1.4;font-weight:700;color:#F6F1DA;text-wrap:balance\">كنيسة الملاك ميخائيل والأنبا شنودة بعياد بك شبرا<\u002Fh2>\n<\u002Fdiv>\n<div style=\"flex:1.4 1 360px;min-width:0;color:#D6D3C8\">\n<p style=\"margin:0 0 24px;font-family:'Amiri',serif;font-size:26px;line-height:1.8;color:#F6F1DA\">كنيسة مجيدة.. حية بالمسيح الحاضر فيها.. أم جاذبة وحاضنة للكل.. لكل عضو فيها دور ورسالة، شاهدة للمسيح، مؤثرة في المجتمع وفي العالم. متأصلة إيمانياً، معاصرة علمياً، كفء إدارياً، ساعية للملكوت<\u002Fp>\n<p style=\"margin:0 0 16px\">[اكتب هنا نبذة عن تاريخ الكنيسة: سنة التأسيس، وقصة بناء الكنيسة، وأهم محطاتها.]<\u002Fp>\n<p style=\"margin:0\">[اكتب هنا كلمة قصيرة من كاهن الكنيسة أو من مجلس الكنيسة، وأسماء الآباء الكهنة.]<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><div id=\"times\" style=\"max-width:1100px;margin:0 auto;padding:40px 24px 40px;box-sizing:border-box\">\n<div style=\"font-size:15px;font-weight:600;color:{{accent}}\">المواعيد<\u002Fdiv>\n<h2 style=\"margin:4px 0 8px;font-family:'Amiri',serif;font-size:38px;line-height:1.4;font-weight:700;color:#F6F1DA\">جدول قداسات شهر نوفمبر ٢٠٢٦<\u002Fh2>\n<p style=\"margin:0 0 28px;color:#B9B6AA\">اضغط على أي يوم لتعرف ميعاد القداس ومكانه والآباء الخدام.<\u002Fp>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start\">\n\n<div style=\"flex:1.3 1 420px;min-width:0\">\n<div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px\">\n<sc-for list=\"{{weekdays}}\" as=\"w\" hint-placeholder-count=\"7\">\n<div style=\"text-align:center;font-size:13px;color:#B9B6AA;padding:6px 0\">{{w.label}}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px\">\n<sc-for list=\"{{cells}}\" as=\"c\" hint-placeholder-count=\"30\">\n<button type=\"button\" class=\"dy\" sc-camel-on-click=\"{{c.pick}}\" aria-label=\"{{c.aria}}\" style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;padding:4px 0;border-radius:8px;border:1.5px solid {{c.border}};background:{{c.bg}};color:{{c.fg}}\">\n<span style=\"font-size:19px;font-weight:600;line-height:1.2\">{{c.d}}<\u002Fspan>\n<span style=\"font-size:11px;line-height:1.2;color:{{c.tagColor}}\">{{c.tag}}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:16px;font-size:14px;color:#B9B6AA\">\n<span>الأحد: خلفية أفتح<\u002Fspan>\n<span>عيد: عيد رئيس الملائكة ميخائيل<\u002Fspan>\n<span>قبطي: القداس القبطي<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:16px 0 0;font-size:15px;color:#B9B6AA\">قداسات مدارس الأحد والخدمات الخاصة يتم الإعلان عنها في الخدمات.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 340px;min-width:0;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:24px\">\n<div style=\"font-size:15px;font-weight:600;color:{{accent}}\">{{day.dayName}}<\u002Fdiv>\n<div style=\"font-family:'Amiri',serif;font-size:34px;line-height:1.4;font-weight:700;color:#F6F1DA\">{{day.dateLabel}}<\u002Fdiv>\n<sc-for list=\"{{day.masses}}\" as=\"m\" hint-placeholder-count=\"2\">\n<div style=\"border-top:1px solid #46433A;padding-top:16px;margin-top:16px;display:flex;flex-direction:column;gap:2px\">\n<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px\">\n<div style=\"font-size:19px;font-weight:600;color:#F1E7A8\">{{m.name}}<\u002Fdiv>\n<div style=\"font-weight:500\">{{m.time}}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"color:#B9B6AA\">{{m.place}}<\u002Fdiv>\n<sc-if value=\"{{m.hasPriest}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"margin-top:6px\"><span style=\"color:#B9B6AA\">خديم القداس: <\u002Fspan>{{m.priest}}<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{m.hasCo}}\" hint-placeholder-val=\"{{ false }}\">\n<div><span style=\"color:#B9B6AA\">{{m.coLabel}}: <\u002Fspan>{{m.co}}<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{m.hasDeacon}}\" hint-placeholder-val=\"{{ true }}\">\n<div><span style=\"color:#B9B6AA\">الدياكون: <\u002Fspan>{{m.deacon}}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- SERVICES -->\n<div id=\"services\" style=\"max-width:1100px;margin:0 auto;padding:40px 24px 40px;box-sizing:border-box\">\n<div style=\"font-size:15px;font-weight:600;color:{{accent}}\">الخدمات<\u002Fdiv>\n<h2 style=\"margin:4px 0 24px;font-family:'Amiri',serif;font-size:38px;line-height:1.4;font-weight:700;color:#F6F1DA\">خدمات الكنيسة<\u002Fh2>\n<div style=\"margin-bottom:40px\">\n<h3 style=\"margin:0 0 4px;font-family:'Amiri',serif;font-size:28px;color:#F1E7A8\">مدارس الأحد والاجتماعات<\u002Fh3>\n<p style=\"margin:0 0 16px;color:#B9B6AA\">اضغط على الخدمة لتعرف ميعادها ومكانها.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n<sc-for list=\"{{services}}\" as=\"s\" hint-placeholder-count=\"13\">\n<button type=\"button\" class=\"dy\" sc-camel-on-click=\"{{s.pick}}\" style=\"padding:10px 20px;min-height:44px;border-radius:6px;font-size:17px;font-weight:500;border:1.5px solid {{s.border}};background:{{s.bg}};color:{{s.fg}}\">{{s.name}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:20px;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:24px;display:flex;flex-wrap:wrap;gap:20px 48px\">\n<div style=\"flex:1 1 220px;min-width:0\"><div style=\"font-size:15px;font-weight:600;color:{{accent}}\">الخدمة<\u002Fdiv><div style=\"font-family:'Amiri',serif;font-size:30px;line-height:1.4;font-weight:700;color:#F6F1DA\">{{svc.name}}<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 180px;min-width:0\"><div style=\"font-size:15px;color:#B9B6AA\">الميعاد<\u002Fdiv><div style=\"font-size:20px;font-weight:600;color:#F1E7A8\">{{svc.when}}<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 220px;min-width:0\"><div style=\"font-size:15px;color:#B9B6AA\">المكان<\u002Fdiv><div style=\"font-size:20px;font-weight:600\">{{svc.place}}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-bottom:40px\">\n<h3 style=\"margin:0 0 4px;font-family:'Amiri',serif;font-size:28px;color:#F1E7A8\">خدمة الألحان<\u002Fh3>\n<p style=\"margin:0 0 16px;color:#B9B6AA\">اضغط على الخورس لتعرف ميعاده ومكانه.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n<sc-for list=\"{{choirs}}\" as=\"c\" hint-placeholder-count=\"3\">\n<button type=\"button\" class=\"dy\" sc-camel-on-click=\"{{c.pick}}\" style=\"padding:10px 20px;min-height:44px;border-radius:6px;font-size:17px;font-weight:500;border:1.5px solid {{c.border}};background:{{c.bg}};color:{{c.fg}}\">{{c.name}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:20px;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:24px;display:flex;flex-wrap:wrap;gap:20px 48px\">\n<div style=\"flex:1 1 220px;min-width:0\"><div style=\"font-size:15px;font-weight:600;color:{{accent}}\">الخورس<\u002Fdiv><div style=\"font-family:'Amiri',serif;font-size:30px;line-height:1.4;font-weight:700;color:#F6F1DA\">{{chor.name}}<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 180px;min-width:0\"><div style=\"font-size:15px;color:#B9B6AA\">الميعاد<\u002Fdiv><div style=\"font-size:20px;font-weight:600;color:#F1E7A8\">{{chor.when}}<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 220px;min-width:0\"><div style=\"font-size:15px;color:#B9B6AA\">المكان<\u002Fdiv><div style=\"font-size:20px;font-weight:600\">{{chor.place}}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n<div style=\"flex:1 1 300px;min-width:0;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:24px\">\n<h3 style=\"margin:0 0 8px;font-family:'Amiri',serif;font-size:24px;color:#F1E7A8\">الافتقاد<\u002Fh3>\n<p style=\"margin:0;color:#D6D3C8\">[اكتب نبذة عن خدمة الافتقاد وكيف يطلبها الأهالي.]<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 300px;min-width:0;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:24px\">\n<h3 style=\"margin:0 0 8px;font-family:'Amiri',serif;font-size:24px;color:#F1E7A8\">الخدمة الاجتماعية<\u002Fh3>\n<p style=\"margin:0;color:#D6D3C8\">[اكتب نبذة عن أعمال الرعاية والمساعدة.]<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- NEWS -->\n<div id=\"news\" style=\"max-width:1100px;margin:0 auto;padding:40px 24px 40px;box-sizing:border-box\">\n<div style=\"font-size:15px;font-weight:600;color:{{accent}}\">الأخبار<\u002Fdiv>\n<h2 style=\"margin:4px 0 24px;font-family:'Amiri',serif;font-size:38px;line-height:1.4;font-weight:700;color:#F6F1DA\">آخر أخبار الكنيسة<\u002Fh2>\n<div style=\"border-top:3px solid #E3C46A;padding-top:16px\">\n<h3 style=\"margin:0 0 4px;font-family:'Amiri',serif;font-size:34px;line-height:1.5;color:#F6F1DA\">نهضة رئيس الملائكة الجليل ميخائيل<\u002Fh3>\n<p style=\"margin:0;color:#F1E7A8;font-weight:600\">من صباح الإثنين ١٦ نوفمبر إلى صباح السبت ٢١ نوفمبر<\u002Fp>\n<p style=\"margin:4px 0 24px;color:#D6D3C8\">الموضوع العام للنهضة: تعبيرات من القداس الغريغوري<\u002Fp>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n\n<div style=\"flex:1 1 330px;min-width:0;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:20px 24px\">\n<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px\"><div style=\"font-family:'Amiri',serif;font-size:24px;font-weight:700;color:#F1E7A8\">الإثنين<\u002Fdiv><div style=\"color:#B9B6AA\">١٦ نوفمبر<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">القداس ٦ ص<\u002Fdiv><div style=\"font-weight:600\">أبونا باخوميوس بدوي<\u002Fdiv><div style=\"color:#D6D3C8\">كنيسة القديسة دميانة والأنبا توماس السائح بشبرا الخيمة<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">المتكلم مساءً<\u002Fdiv><div style=\"font-weight:600\">الأنبا هرمينا<\u002Fdiv><div style=\"color:#D6D3C8\">الأسقف العام لقطاع شرق الإسكندرية<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">العظة<\u002Fdiv><div style=\"font-weight:600\">\"غير موصوفة هي قوة حكمتك\"<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:#B9B6AA\">التسميع: من آية ٢١ لآية ٢٤<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 330px;min-width:0;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:20px 24px\">\n<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px\"><div style=\"font-family:'Amiri',serif;font-size:24px;font-weight:700;color:#F1E7A8\">الثلاثاء<\u002Fdiv><div style=\"color:#B9B6AA\">١٧ نوفمبر<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">القداس ٦ ص<\u002Fdiv><div style=\"font-weight:600\">أبونا إسطفانوس طلعت<\u002Fdiv><div style=\"color:#D6D3C8\">كنيسة الملاك ميخائيل بطوسون<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">المتكلم مساءً<\u002Fdiv><div style=\"font-weight:600\">القمص مكاري القمص نادرس<\u002Fdiv><div style=\"color:#D6D3C8\">مطرانية شبرا الخيمة<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">العظة<\u002Fdiv><div style=\"font-weight:600\">\"لجة محبتك للبشر\"<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:#B9B6AA\">التسميع: من آية ٢٧ لآية ٣٢<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 330px;min-width:0;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:20px 24px\">\n<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px\"><div style=\"font-family:'Amiri',serif;font-size:24px;font-weight:700;color:#F1E7A8\">الأربعاء<\u002Fdiv><div style=\"color:#B9B6AA\">١٨ نوفمبر<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">القداس ٧:٣٠ ص<\u002Fdiv><div style=\"font-weight:600\">أبونا بيشوي نبيل<\u002Fdiv><div style=\"color:#D6D3C8\">كنيسة العذراء والأنبا بيشوي، السليمانية، أكتوبر<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">المتكلم مساءً<\u002Fdiv><div style=\"font-weight:600\">القمص أنجيلوس بياوي<\u002Fdiv><div style=\"color:#D6D3C8\">كنيسة القديسة دميانة بالعدوية<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">العظة<\u002Fdiv><div style=\"font-weight:600\">\"أخضعت كل شيء تحت قدمي\"<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:#B9B6AA\">التسميع: من آية ٣٣ لآية ٣٧<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 330px;min-width:0;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:20px 24px\">\n<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px\"><div style=\"font-family:'Amiri',serif;font-size:24px;font-weight:700;color:#F1E7A8\">الخميس<\u002Fdiv><div style=\"color:#B9B6AA\">١٩ نوفمبر<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">القداس ٧:٣٠ ص<\u002Fdiv><div style=\"font-weight:600\">قداس كهنة حي جزيرة بدران<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">المتكلم مساءً<\u002Fdiv><div style=\"font-weight:600\">القمص بيشوي جورج<\u002Fdiv><div style=\"color:#D6D3C8\">كنيسة مارجرجس بمنشية الصدر<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">العظة<\u002Fdiv><div style=\"font-weight:600\">\"وضعت فيَّ موهبة النطق\"<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:#B9B6AA\">التسميع: من آية ٣٨ لآية ٤٢<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 330px;min-width:0;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:20px 24px\">\n<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px\"><div style=\"font-family:'Amiri',serif;font-size:24px;font-weight:700;color:#F1E7A8\">الجمعة<\u002Fdiv><div style=\"color:#B9B6AA\">٢٠ نوفمبر<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">القداس ٧:٣٠ ص<\u002Fdiv><div style=\"font-weight:600\">أبونا مرقس منير<\u002Fdiv><div style=\"color:#D6D3C8\">كنيسة مارمرقس شبرا<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">المتكلم مساءً<\u002Fdiv><div style=\"font-weight:600\">الأنبا مكاري<\u002Fdiv><div style=\"color:#D6D3C8\">أسقف عام كنائس شبرا الجنوبية<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">العظة<\u002Fdiv><div style=\"font-weight:600\">\"أعطيتني علم معرفتك\"<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:#B9B6AA\">التسميع: من آية ٤٣ لآية ٤٨<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 330px;min-width:0;background:#4A3C16;border:1px solid #E3C46A;border-radius:8px;padding:20px 24px\">\n<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px\"><div style=\"font-family:'Amiri',serif;font-size:24px;font-weight:700;color:#F1E7A8\">السبت<\u002Fdiv><div style=\"color:#E3D9A8\">٢١ نوفمبر<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #7A6A38;padding-top:12px\"><div style=\"font-size:14px;color:#E3D9A8\">٧ صباحًا<\u002Fdiv><div style=\"font-family:'Amiri',serif;font-size:26px;font-weight:700;color:#F6F1DA\">قداس عيد الملاك<\u002Fdiv><div style=\"color:#F6F1DA\">بحضور نيافة الأنبا مكاري أسقفنا المحبوب<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<div style=\"margin-top:24px;display:flex;flex-direction:column;gap:6px;color:#D6D3C8\">\n<div>رفع بخور عشية والتمجيد يوميًا الساعة ٦:٣٠ م، والتسميع من الساعة ٦ م.<\u002Fdiv>\n<div>بدء الكلمة المسائية يوميًا الساعة ٧:٣٠ م.<\u002Fdiv>\n<div>يوميًا هدايا قبولًا، والهدية الكبرى.<\u002Fdiv>\n<div>هدايا قيمة للتسميع (مقتطفات من متى ٥).<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- CONTACT -->\n<div id=\"contact\" style=\"max-width:1100px;margin:0 auto;padding:40px 24px 80px;box-sizing:border-box\">\n<div style=\"background:linear-gradient(135deg,#EFDC96,#C9A24A);color:#2A2417;border-radius:10px;padding:40px 32px;display:flex;flex-wrap:wrap;gap:32px 64px\">\n<div style=\"flex:1 1 280px;min-width:0\">\n<div style=\"font-size:15px;font-weight:600;color:#4A3A12\">تواصل معنا<\u002Fdiv>\n<h2 style=\"margin:4px 0 0;font-family:'Amiri',serif;font-size:38px;line-height:1.4;font-weight:700\">نسعد بزيارتك<\u002Fh2>\n<\u002Fdiv>\n<div style=\"flex:1.4 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px;font-weight:500\">\n<div><span style=\"color:#4A3A12;font-weight:400\">العنوان: <\u002Fspan>عياد بك، شبرا، [اكتب العنوان بالتفصيل]<\u002Fdiv>\n<div><span style=\"color:#4A3A12;font-weight:400\">صفحة الفيسبوك: <\u002Fspan><a href=\"https://www.facebook.com/share/1CHUVz3te8/?mibextid=wwXIfr\" style=\"color:#2A2417;text-decoration:underline;text-underline-offset:4px\">صفحة الكنيسة على فيسبوك<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- FOOTER -->\n<div style=\"border-top:  معنا<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:48px 64px;padding-top:64px\">\n<div style=\"flex:1 1 420px;min-width:0\">\n<div style=\"font-size:15px;font-weight:600;letter-spacing:.04em;color:#E3C46A\">الكنيسة القبطية الأرثوذكسية<\u002Fdiv>\n<h1 style=\"margin:12px 0 0;font-family:'Amiri',serif;font-weight:700;font-size:clamp(30px,4.6vw,48px);line-height:1.5;color:#F6F1DA;text-wrap:balance\">كنيسة رئيس الملائكة الجليل ميخائيل والقديس العظيم الأنبا شنودة رئيس المتوحدين<\u002Fh1>\n<div style=\"margin-top:8px;font-family:'Amiri',serif;font-size:28px;font-weight:700;color:#E3C46A\">بعياد بك بشبرا<\u002Fdiv>\n<p style=\"margin:20px 0 0;font-size:18px;color:#D6D3C8;max-width:52ch\">بيتك وبيت أسرتك. تعالَ صلِّ معنا، وتعرّف على مواعيد القداسات والاجتماعات والخدمات.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:32px\">\n<a class=\"btn\" href=\"#times\" style=\"display:inline-block;background:#E3C46A;color:#2A2417;padding:13px 28px;border-radius:6px;font-weight:600\">مواعيد القداسات<\u002Fa>\n<a class=\"btn\" href=\"#contact\" style=\"display:inline-block;border:1.5px solid #E3C46A;color:#F1E7A8;padding:11.5px 28px;border-radius:6px;font-weight:600\">كيف تصل إلينا<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:0 1 380px;width:100%;max-width:380px;min-width:0;margin-inline:auto\">\n<img src=\"c36e58cc-e701-457f-a7fe-a6694dd87150\" alt=\"شعار كنيسة رئيس الملائكة ميخائيل والأنبا شنودة بعياد بك بشبرا\" style=\"display:block;width:100%;aspect-ratio:1/1;border-radius:50%;object-fit:cover;box-shadow:0 20px 50px rgba(0,0,0,.45)\">\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n\n\n\n<div id=\"about\" style=\"max-width:1100px;margin:0 auto;padding:80px 24px 40px;box-sizing:border-box\">\n<div style=\"display:flex;flex-wrap:wrap;gap:32px 64px\">\n<div style=\"flex:1 1 320px;min-width:0\">\n<div style=\"font-size:15px;font-weight:600;color:#E3C46A\">عن الكنيسة<\u002Fdiv>\n<h2 style=\"margin:4px 0 0;font-family:'Amiri',serif;font-size:38px;line-height:1.4;font-weight:700;color:#F6F1DA;text-wrap:balance\">كنيسة الملاك ميخائيل والأنبا شنودة بعياد بك شبرا<\u002Fh2>\n<\u002Fdiv>\n<div style=\"flex:1.4 1 360px;min-width:0;color:#D6D3C8\">\n<p style=\"margin:0 0 24px;font-family:'Amiri',serif;font-size:26px;line-height:1.8;color:#F6F1DA\">كنيسة مجيدة.. حية بالمسيح الحاضر فيها.. أم جاذبة وحاضنة للكل.. لكل عضو فيها دور ورسالة، شاهدة للمسيح، مؤثرة في المجتمع وفي العالم. متأصلة إيمانياً، معاصرة علمياً، كفء إدارياً، ساعية للملكوت<\u002Fp>\n<p style=\"margin:0 0 16px\">[اكتب هنا نبذة عن تاريخ الكنيسة: سنة التأسيس، وقصة بناء الكنيسة، وأهم محطاتها.]<\u002Fp>\n<p style=\"margin:0\">[اكتب هنا كلمة قصيرة من كاهن الكنيسة أو من مجلس الكنيسة، وأسماء الآباء الكهنة.]<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><div id=\"times\" style=\"max-width:1100px;margin:0 auto;padding:40px 24px 40px;box-sizing:border-box\">\n<div style=\"font-size:15px;font-weight:600;color:#E3C46A\">المواعيد<\u002Fdiv>\n<h2 style=\"margin:4px 0 8px;font-family:'Amiri',serif;font-size:38px;line-height:1.4;font-weight:700;color:#F6F1DA\">جدول قداسات شهر نوفمبر ٢٠٢٦<\u002Fh2>\n<p style=\"margin:0 0 28px;color:#B9B6AA\">اضغط على أي يوم لتعرف ميعاد القداس ومكانه والآباء الخدام.<\u002Fp>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start\">\n\n<div style=\"flex:1.3 1 420px;min-width:0\">\n<div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px\">\n\n<div style=\"text-align:center;font-size:13px;color:#B9B6AA;padding:6px 0\">{{w.label}}<\u002Fdiv>\n\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px\">\n\n<button type=\"button\" class=\"dy\" style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;padding:4px 0;border-radius:8px;border:1.5px solid ;background:;color:\">\n<span style=\"font-size:19px;font-weight:600;line-height:1.2\">{{c.d}}<\u002Fspan>\n<span style=\"font-size:11px;line-height:1.2;color:\">{{c.tag}}<\u002Fspan>\n<\u002Fbutton>\n\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:16px;font-size:14px;color:#B9B6AA\">\n<span>الأحد: خلفية أفتح<\u002Fspan>\n<span>عيد: عيد رئيس الملائكة ميخائيل<\u002Fspan>\n<span>قبطي: القداس القبطي<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:16px 0 0;font-size:15px;color:#B9B6AA\">قداسات مدارس الأحد والخدمات الخاصة يتم الإعلان عنها في الخدمات.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 340px;min-width:0;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:24px\">\n<div style=\"font-size:15px;font-weight:600;color:#E3C46A\">{{day.dayName}}<\u002Fdiv>\n<div style=\"font-family:'Amiri',serif;font-size:34px;line-height:1.4;font-weight:700;color:#F6F1DA\">{{day.dateLabel}}<\u002Fdiv>\n\n<div style=\"border-top:1px solid #46433A;padding-top:16px;margin-top:16px;display:flex;flex-direction:column;gap:2px\">\n<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px\">\n<div style=\"font-size:19px;font-weight:600;color:#F1E7A8\">{{m.name}}<\u002Fdiv>\n<div style=\"font-weight:500\">{{m.time}}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"color:#B9B6AA\">{{m.place}}<\u002Fdiv>\n\n<div style=\"margin-top:6px\"><span style=\"color:#B9B6AA\">خديم القداس: <\u002Fspan>{{m.priest}}<\u002Fdiv>\n\n\n<div><span style=\"color:#B9B6AA\">{{m.coLabel}}: <\u002Fspan>{{m.co}}<\u002Fdiv>\n\n\n<div><span style=\"color:#B9B6AA\">الدياكون: <\u002Fspan>{{m.deacon}}<\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<div id=\"services\" style=\"max-width:1100px;margin:0 auto;padding:40px 24px 40px;box-sizing:border-box\">\n<div style=\"font-size:15px;font-weight:600;color:#E3C46A\">الخدمات<\u002Fdiv>\n<h2 style=\"margin:4px 0 24px;font-family:'Amiri',serif;font-size:38px;line-height:1.4;font-weight:700;color:#F6F1DA\">خدمات الكنيسة<\u002Fh2>\n<div style=\"margin-bottom:40px\">\n<h3 style=\"margin:0 0 4px;font-family:'Amiri',serif;font-size:28px;color:#F1E7A8\">مدارس الأحد والاجتماعات<\u002Fh3>\n<p style=\"margin:0 0 16px;color:#B9B6AA\">اضغط على الخدمة لتعرف ميعادها ومكانها.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n\n<button type=\"button\" class=\"dy\" style=\"padding:10px 20px;min-height:44px;border-radius:6px;font-size:17px;font-weight:500;border:1.5px solid ;background:;color:\">{{s.name}}<\u002Fbutton>\n\n<\u002Fdiv>\n<div style=\"margin-top:20px;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:24px;display:flex;flex-wrap:wrap;gap:20px 48px\">\n<div style=\"flex:1 1 220px;min-width:0\"><div style=\"font-size:15px;font-weight:600;color:#E3C46A\">الخدمة<\u002Fdiv><div style=\"font-family:'Amiri',serif;font-size:30px;line-height:1.4;font-weight:700;color:#F6F1DA\">{{svc.name}}<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 180px;min-width:0\"><div style=\"font-size:15px;color:#B9B6AA\">الميعاد<\u002Fdiv><div style=\"font-size:20px;font-weight:600;color:#F1E7A8\">{{svc.when}}<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 220px;min-width:0\"><div style=\"font-size:15px;color:#B9B6AA\">المكان<\u002Fdiv><div style=\"font-size:20px;font-weight:600\">{{svc.place}}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-bottom:40px\">\n<h3 style=\"margin:0 0 4px;font-family:'Amiri',serif;font-size:28px;color:#F1E7A8\">خدمة الألحان<\u002Fh3>\n<p style=\"margin:0 0 16px;color:#B9B6AA\">اضغط على الخورس لتعرف ميعاده ومكانه.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n\n<button type=\"button\" class=\"dy\" style=\"padding:10px 20px;min-height:44px;border-radius:6px;font-size:17px;font-weight:500;border:1.5px solid ;background:;color:\">{{c.name}}<\u002Fbutton>\n\n<\u002Fdiv>\n<div style=\"margin-top:20px;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:24px;display:flex;flex-wrap:wrap;gap:20px 48px\">\n<div style=\"flex:1 1 220px;min-width:0\"><div style=\"font-size:15px;font-weight:600;color:#E3C46A\">الخورس<\u002Fdiv><div style=\"font-family:'Amiri',serif;font-size:30px;line-height:1.4;font-weight:700;color:#F6F1DA\">{{chor.name}}<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 180px;min-width:0\"><div style=\"font-size:15px;color:#B9B6AA\">الميعاد<\u002Fdiv><div style=\"font-size:20px;font-weight:600;color:#F1E7A8\">{{chor.when}}<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 220px;min-width:0\"><div style=\"font-size:15px;color:#B9B6AA\">المكان<\u002Fdiv><div style=\"font-size:20px;font-weight:600\">{{chor.place}}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n<div style=\"flex:1 1 300px;min-width:0;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:24px\">\n<h3 style=\"margin:0 0 8px;font-family:'Amiri',serif;font-size:24px;color:#F1E7A8\">الافتقاد<\u002Fh3>\n<p style=\"margin:0;color:#D6D3C8\">[اكتب نبذة عن خدمة الافتقاد وكيف يطلبها الأهالي.]<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 300px;min-width:0;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:24px\">\n<h3 style=\"margin:0 0 8px;font-family:'Amiri',serif;font-size:24px;color:#F1E7A8\">الخدمة الاجتماعية<\u002Fh3>\n<p style=\"margin:0;color:#D6D3C8\">[اكتب نبذة عن أعمال الرعاية والمساعدة.]<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<div id=\"news\" style=\"max-width:1100px;margin:0 auto;padding:40px 24px 40px;box-sizing:border-box\">\n<div style=\"font-size:15px;font-weight:600;color:#E3C46A\">الأخبار<\u002Fdiv>\n<h2 style=\"margin:4px 0 24px;font-family:'Amiri',serif;font-size:38px;line-height:1.4;font-weight:700;color:#F6F1DA\">آخر أخبار الكنيسة<\u002Fh2>\n<div style=\"border-top:3px solid #E3C46A;padding-top:16px\">\n<h3 style=\"margin:0 0 4px;font-family:'Amiri',serif;font-size:34px;line-height:1.5;color:#F6F1DA\">نهضة رئيس الملائكة الجليل ميخائيل<\u002Fh3>\n<p style=\"margin:0;color:#F1E7A8;font-weight:600\">من صباح الإثنين ١٦ نوفمبر إلى صباح السبت ٢١ نوفمبر<\u002Fp>\n<p style=\"margin:4px 0 24px;color:#D6D3C8\">الموضوع العام للنهضة: تعبيرات من القداس الغريغوري<\u002Fp>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n\n<div style=\"flex:1 1 330px;min-width:0;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:20px 24px\">\n<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px\"><div style=\"font-family:'Amiri',serif;font-size:24px;font-weight:700;color:#F1E7A8\">الإثنين<\u002Fdiv><div style=\"color:#B9B6AA\">١٦ نوفمبر<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">القداس ٦ ص<\u002Fdiv><div style=\"font-weight:600\">أبونا باخوميوس بدوي<\u002Fdiv><div style=\"color:#D6D3C8\">كنيسة القديسة دميانة والأنبا توماس السائح بشبرا الخيمة<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">المتكلم مساءً<\u002Fdiv><div style=\"font-weight:600\">الأنبا هرمينا<\u002Fdiv><div style=\"color:#D6D3C8\">الأسقف العام لقطاع شرق الإسكندرية<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">العظة<\u002Fdiv><div style=\"font-weight:600\">\"غير موصوفة هي قوة حكمتك\"<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:#B9B6AA\">التسميع: من آية ٢١ لآية ٢٤<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 330px;min-width:0;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:20px 24px\">\n<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px\"><div style=\"font-family:'Amiri',serif;font-size:24px;font-weight:700;color:#F1E7A8\">الثلاثاء<\u002Fdiv><div style=\"color:#B9B6AA\">١٧ نوفمبر<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">القداس ٦ ص<\u002Fdiv><div style=\"font-weight:600\">أبونا إسطفانوس طلعت<\u002Fdiv><div style=\"color:#D6D3C8\">كنيسة الملاك ميخائيل بطوسون<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">المتكلم مساءً<\u002Fdiv><div style=\"font-weight:600\">القمص مكاري القمص نادرس<\u002Fdiv><div style=\"color:#D6D3C8\">مطرانية شبرا الخيمة<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">العظة<\u002Fdiv><div style=\"font-weight:600\">\"لجة محبتك للبشر\"<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:#B9B6AA\">التسميع: من آية ٢٧ لآية ٣٢<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 330px;min-width:0;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:20px 24px\">\n<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px\"><div style=\"font-family:'Amiri',serif;font-size:24px;font-weight:700;color:#F1E7A8\">الأربعاء<\u002Fdiv><div style=\"color:#B9B6AA\">١٨ نوفمبر<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">القداس ٧:٣٠ ص<\u002Fdiv><div style=\"font-weight:600\">أبونا بيشوي نبيل<\u002Fdiv><div style=\"color:#D6D3C8\">كنيسة العذراء والأنبا بيشوي، السليمانية، أكتوبر<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">المتكلم مساءً<\u002Fdiv><div style=\"font-weight:600\">القمص أنجيلوس بياوي<\u002Fdiv><div style=\"color:#D6D3C8\">كنيسة القديسة دميانة بالعدوية<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">العظة<\u002Fdiv><div style=\"font-weight:600\">\"أخضعت كل شيء تحت قدمي\"<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:#B9B6AA\">التسميع: من آية ٣٣ لآية ٣٧<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 330px;min-width:0;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:20px 24px\">\n<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px\"><div style=\"font-family:'Amiri',serif;font-size:24px;font-weight:700;color:#F1E7A8\">الخميس<\u002Fdiv><div style=\"color:#B9B6AA\">١٩ نوفمبر<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">القداس ٧:٣٠ ص<\u002Fdiv><div style=\"font-weight:600\">قداس كهنة حي جزيرة بدران<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">المتكلم مساءً<\u002Fdiv><div style=\"font-weight:600\">القمص بيشوي جورج<\u002Fdiv><div style=\"color:#D6D3C8\">كنيسة مارجرجس بمنشية الصدر<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">العظة<\u002Fdiv><div style=\"font-weight:600\">\"وضعت فيَّ موهبة النطق\"<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:#B9B6AA\">التسميع: من آية ٣٨ لآية ٤٢<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 330px;min-width:0;background:#323236;border:1px solid #5A5238;border-radius:8px;padding:20px 24px\">\n<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px\"><div style=\"font-family:'Amiri',serif;font-size:24px;font-weight:700;color:#F1E7A8\">الجمعة<\u002Fdiv><div style=\"color:#B9B6AA\">٢٠ نوفمبر<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">القداس ٧:٣٠ ص<\u002Fdiv><div style=\"font-weight:600\">أبونا مرقس منير<\u002Fdiv><div style=\"color:#D6D3C8\">كنيسة مارمرقس شبرا<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">المتكلم مساءً<\u002Fdiv><div style=\"font-weight:600\">الأنبا مكاري<\u002Fdiv><div style=\"color:#D6D3C8\">أسقف عام كنائس شبرا الجنوبية<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #46433A;padding-top:12px\"><div style=\"font-size:14px;color:#B9B6AA\">العظة<\u002Fdiv><div style=\"font-weight:600\">\"أعطيتني علم معرفتك\"<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:#B9B6AA\">التسميع: من آية ٤٣ لآية ٤٨<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 330px;min-width:0;background:#4A3C16;border:1px solid #E3C46A;border-radius:8px;padding:20px 24px\">\n<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px\"><div style=\"font-family:'Amiri',serif;font-size:24px;font-weight:700;color:#F1E7A8\">السبت<\u002Fdiv><div style=\"color:#E3D9A8\">٢١ نوفمبر<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:12px;border-top:1px solid #7A6A38;padding-top:12px\"><div style=\"font-size:14px;color:#E3D9A8\">٧ صباحًا<\u002Fdiv><div style=\"font-family:'Amiri',serif;font-size:26px;font-weight:700;color:#F6F1DA\">قداس عيد الملاك<\u002Fdiv><div style=\"color:#F6F1DA\">بحضور نيافة الأنبا مكاري أسقفنا المحبوب<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<div style=\"margin-top:24px;display:flex;flex-direction:column;gap:6px;color:#D6D3C8\">\n<div>رفع بخور عشية والتمجيد يوميًا الساعة ٦:٣٠ م، والتسميع من الساعة ٦ م.<\u002Fdiv>\n<div>بدء الكلمة المسائية يوميًا الساعة ٧:٣٠ م.<\u002Fdiv>\n<div>يوميًا هدايا قبولًا، والهدية الكبرى.<\u002Fdiv>\n<div>هدايا قيمة للتسميع (مقتطفات من متى ٥).<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<div id=\"contact\" style=\"max-width:1100px;margin:0 auto;padding:40px 24px 80px;box-sizing:border-box\">\n<div style=\"background:linear-gradient(135deg,#EFDC96,#C9A24A);color:#2A2417;border-radius:10px;padding:40px 32px;display:flex;flex-wrap:wrap;gap:32px 64px\">\n<div style=\"flex:1 1 280px;min-width:0\">\n<div style=\"font-size:15px;font-weight:600;color:#4A3A12\">تواصل معنا<\u002Fdiv>\n<h2 style=\"margin:4px 0 0;font-family:'Amiri',serif;font-size:38px;line-height:1.4;font-weight:700\">نسعد بزيارتك<\u002Fh2>\n<\u002Fdiv>\n<div style=\"flex:1.4 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px;font-weight:500\">\n<div><span style=\"color:#4A3A12;font-weight:400\">العنوان: <\u002Fspan>عياد بك، شبرا، [اكتب العنوان بالتفصيل]<\u002Fdiv>\n<div><span style=\"color:#4A3A12;font-weight:400\">صفحة الفيسبوك: <\u002Fspan><a href=\"https://www.facebook.com/share/1CHUVz3te8/?mibextid=wwXIfr\" style=\"color:#2A2417;text-decoration:underline;text-underline-offset:4px\">صفحة الكنيسة على فيسبوك<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<div style=\"border-top:1px solid #5A5238\">\n<div style=\"max-width:1100px;margin:0 auto;padding:24px;box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 24px;font-size:15px;color:#B9B6AA\">\n<div>كنيسة رئيس الملائكة الجليل ميخائيل والقديس العظيم الأنبا شنودة رئيس المتوحدين · عياد بك بشبرا<\u002Fdiv>\n<div>الكنيسة القبطية الأرثوذكسية<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E3C46A&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:2900}}\">\nclass Component extends DCLogic {\nrenderVals() {\nconst ar = (n) => String(n).replace(/[0-9]/g, (x) => '٠١٢٣٤٥٦٧٨٩'[Number(x)]);\nconst weekdays = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];\n\n// الآباء الخدام\nconst P = {\nA: 'القمص أنطونيوس إيليا',\nM: 'القس ميخائيل سمير',\nS: 'القس صموئيل سمير',\nB: 'القس أبرام سامي',\nY: 'القس بيشوى سعيد',\nT: 'القس تيطس موريس',\nD: 'القس دانيال صليب',\nX: 'أبونا صموئيل صموئيل'\n};\n// الأماكن\nconst PL = {\nshn: 'مذبح الأنبا شنودة',\nmal: 'مذبح الملاك',\nkar: 'مذبح الأنبا كاراس',\nyoh: 'مذبح مار يوحنا'\n};\n// المواعيد\nconst T1 = '٦:٠٠ – ٨:٠٠ ص';\nconst T2 = '٨:٠٠ – ١٠:٣٠ ص';\nconst T3 = '٦:٠٠ – ٧:٣٠ ص';\nconst T4 = '٧:٣٠ – ٩:٣٠ ص';\nconst T5 = '٧:٣٠ – ١٠:٣٠ ص';\nconst T6 = '٧:٠٠ – ٩:٠٠ ص';\nconst T7 = '١٠:٠٠ ص – ١٢:٠٠ م';\nconst T8 = '٦:٣٠ – ٧:٣٠ م';\n\nconst m = (name, place, time, p, co, dc) => ({\nname: name,\nplace: PL[place],\ntime: time,\npriest: p ? P[p] : '',\nco: (co || []).map((k) => P[k]).join('، '),\ndeacon: dc || ''\n});\nconst q1 = (p, co, dc) => m('القداس الأول', 'shn', T1, p, co, dc);\nconst q2 = (p, co) => m('القداس الثاني', 'mal', T2, p, co, '');\nconst ch = (place, time, p, dc) => m('قداس الكنيسة', place, time, p, [], dc);\n\nconst DAYS = {\n1: [q1('D', [], 'جرجس'), q2('A', ['T'])],\n2: [ch('mal', T1, 'M', 'يوسف')],\n3: [ch('mal', T3, 'T', '')],\n4: [ch('mal', T4, 'B', 'اسحق')],\n5: [ch('kar', T4, 'X', 'جرجس')],\n6: [ch('mal', T5, 'B', 'بيجيمي')],\n7: [ch('mal', T6, 'S', 'يوسف')],\n8: [q1('T', [], 'جرجس'), q2('A', ['D'])],\n9: [ch('mal', T1, 'M', 'يوسف')],\n10: [ch('mal', T3, 'M', '')],\n11: [ch('mal', T4, 'B', 'اسحق')],\n12: [ch('kar', T4, 'X', 'جرجس')],\n13: [ch('mal', T5, 'S', 'بيجيمي')],\n14: [ch('mal', T6, 'B', 'يوسف')],\n15: [q1('D', [], 'جرجس'), q2('A', ['T'])],\n16: [ch('mal', T1, 'M', 'يوسف')],\n17: [ch('mal', T3, 'D', '')],\n18: [ch('mal', T4, 'Y', 'اسحق')],\n19: [ch('kar', T4, 'X', 'جرجس')],\n20: [ch('mal', T5, 'M', 'بيجيمي'), m('عشية عيد الملاك', 'mal', T8, '', [], '')],\n21: [m('عيد الملاك', 'mal', T6, 'A', ['D', 'T', 'Y', 'B', 'S', 'M'], 'يوسف')],\n22: [q1('T', [], 'جرجس'), q2('A', ['S'])],\n23: [ch('mal', T1, 'T', 'يوسف')],\n24: [ch('mal', T3, 'S', '')],\n25: [ch('mal', T7, 'Y', 'اسحق')],\n26: [ch('kar', T6, 'X', 'جرجس')],\n27: [ch('mal', T5, 'Y', 'بيجيمي')],\n28: [ch('mal', T6, 'B', 'يوسف'), m('القداس القبطي', 'yoh', '٧:٠٠ – ٩:٣٠ ص', '', [], '')],\n29: [q1('S', [], 'جرجس'), q2('A', ['Y'])],\n30: [ch('mal', T1, 'D', 'يوسف')]\n};\n// القداس القبطي: يخدمه آباء كهنة الكنيسة\nDAYS[28][1].priest = 'الآباء كهنة الكنيسة';\n\nconst now = new Date();\nconst today = (now.getFullYear() === 2026 && now.getMonth() === 10) ? now.getDate() : null;\nconst sel = (this.state && this.state.sel) ? this.state.sel : (today || 1);\n\nconst cells = [];\nfor (let d = 1; d <= 30; d++) {\nconst list = DAYS[d] || [];\nconst dow = (d - 1) % 7;\nconst isSel = d === sel;\nconst feast = d === 21;\nconst coptic = d === 28;\nlet bg = dow === 0 ? '#3B3B40' : '#323236';\nlet border = dow === 0 ? '#5A5238' : '#46433A';\nlet fg = '#ECE9E0';\nlet tagColor = '#B9B6AA';\nif (feast) { bg = '#4A3C16'; border = '#E3C46A'; fg = '#F1E7A8'; tagColor = '#F1E7A8'; }\nif (isSel) { bg = '#E3C46A'; border = '#E3C46A'; fg = '#2A2417'; tagColor = '#2A2417'; }\nlet tag = list.length > 1 ? 'قداسان' : '';\nif (d === 20) tag = 'عشية';\nif (coptic) tag = 'قبطي';\nif (feast) tag = 'عيد';\nif (today === d) tag = 'اليوم';\ncells.push({\nd: ar(d),\ntag: tag,\nbg: bg,\nborder: border,\nfg: fg,\ntagColor: tagColor,\naria: weekdays[dow] + ' ' + ar(d) + ' نوفمبر، ' + ar(list.length) + ' من القداسات',\npick: () => this.setState({ sel: d })\n});\n}\n\nconst masses = (DAYS[sel] || []).map((x) => ({\nname: x.name,\nplace: x.place,\ntime: x.time,\npriest: x.priest,\nco: x.co,\ndeacon: x.deacon,\nhasPriest: !!x.priest,\nhasCo: !!x.co,\nhasDeacon: !!x.deacon,\ncoLabel: x.co.indexOf('،') > -1 ? 'الشركاء' : 'شريك'\n}));\n\n// الخدمات: الميعاد والمكان (المكان يُكتب في place عند وصوله)\nconst SV = [\n{ name: 'ملايكة', when: 'الجمعة ١١:٠٠ ص', place: 'الدور الأرضي، مبنى الخدمات' },\n{ name: 'حضانة', when: 'الجمعة ١١:٠٠ ص', place: 'كنيسة مار يوحنا، مبنى الخدمات' },\n{ name: 'أولى وثانية · مشترك', when: 'الجمعة ١٠:٣٠ ص', place: 'الدور الثاني، مبنى الخدمات' },\n{ name: 'ثالثة ورابعة · مشترك', when: 'الجمعة ١:٠٠ م', place: 'الكنيسة' },\n{ name: 'خامسة وسادسة بنين', when: 'الجمعة ٣:٠٠ م', place: 'كنيسة مار يوحنا، مبنى الخدمات' },\n{ name: 'خامسة وسادسة بنات', when: 'الجمعة ٣:٠٠ م', place: 'الدور الثاني، مبنى الخدمات' },\n{ name: 'إعدادي بنين', when: 'الخميس ٥:٣٠ م', place: 'الكنيسة' },\n{ name: 'إعدادي بنات', when: 'الجمعة ٣:٠٠ م', place: 'الكنيسة' },\n{ name: 'ثانوي بنين', when: 'الخميس ٦:٠٠ م', place: 'كنيسة مار يوحنا، مبنى الخدمات' },\n{ name: 'ثانوي بنات', when: 'الجمعة ٥:٠٠ م', place: 'الدور الثاني، مبنى الخدمات' },\n{ name: 'إعداد خدام', when: 'الجمعة ١:٠٠ م', place: 'كنيسة مار يوحنا، مبنى الخدمات' },\n{ name: 'اجتماع الصخرة', when: 'الجمعة ١٠:٠٠ ص', place: 'الكنيسة' },\n{ name: 'اجتماع شباب', when: 'الخميس ٧:٣٠ م', place: 'الكنيسة' },\n{ name: 'اجتماع الأسرة', when: 'الجمعة ٧:٠٠ م', place: 'الكنيسة' },\n{ name: 'اجتماع سيدات', when: 'الأربعاء ٥:٠٠ م', place: 'الكنيسة' }\n];\nconst CH = [\n{ name: 'خورس حضانة وملايكة', when: 'الجمعة ٥:٣٠ م', place: 'كنيسة مار يوحنا' },\n{ name: 'خورس إعدادي', when: 'الجمعة ٥:٣٠ م', place: 'الدور السادس شمال' },\n{ name: 'خورس ثانوي وجامعة', when: 'الجمعة ٥:٣٠ م', place: 'الدور السادس يمين' }\n];\nconst ci = (this.state && this.state.chor != null) ? this.state.chor : 0;\nconst choirs = CH.map((x, i) => ({\nname: x.name,\nbg: i === ci ? '#E3C46A' : '#323236',\nborder: i === ci ? '#E3C46A' : '#5A5238',\nfg: i === ci ? '#2A2417' : '#ECE9E0',\npick: () => this.setState({ chor: i })\n}));\nconst curC = CH[ci];\nconst si = (this.state && this.state.svc != null) ? this.state.svc : 0;\nconst services = SV.map((x, i) => ({\nname: x.name,\nbg: i === si ? '#E3C46A' : '#323236',\nborder: i === si ? '#E3C46A' : '#5A5238',\nfg: i === si ? '#2A2417' : '#ECE9E0',\npick: () => this.setState({ svc: i })\n}));\nconst cur = SV[si];\n\nreturn {\nchoirs: choirs,\nchor: { name: curC.name, when: curC.when, place: curC.place },\nservices: services,\nsvc: { name: cur.name, when: cur.when || '[الميعاد]', place: cur.place || '[المكان]' },\naccent: this.props.accent ?? '#E3C46A',\nweekdays: weekdays.map((l) => ({ label: l })),\ncells: cells,\nday: {\ndayName: weekdays[(sel - 1) % 7],\ndateLabel: ar(sel) + ' نوفمبر ٢٠٢٦',\nmasses: masses\n}\n};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
